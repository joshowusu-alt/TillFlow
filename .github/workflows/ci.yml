name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  TZ: Africa/Accra

# Stable displayed check names (Gate 3 interface):
#   CI / lint
#   CI / unit
#   CI / typecheck
#   CI / build
#   CI / pos-safety
# Job `name:` values must stay literal — do not matrix or templatize them.
# Coverage is not a required gate — see docs/reliability/CI_GOVERNANCE.md.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci-unit.db
      TZ: Africa/Accra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for SQLite
        run: npm run db:prepare:ci

      - name: Unit tests
        run: npm test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Explicit tsc — independent of next build. Uses tsconfig.json (noEmit).
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci-build.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for SQLite
        run: npm run db:prepare:ci

      - name: Production build
        run: npm run build

      - name: Upload Next.js build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          if-no-files-found: error
          # `.next` is a dot-directory; upload-artifact@v4 excludes hidden paths by default.
          include-hidden-files: true

  pos-safety:
    name: pos-safety
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Job-local SQLite — does not share unit/build DB files.
      DATABASE_URL: file:./ci-pos-safety.db
      BASE_URL: http://localhost:6200
      E2E_OWNER_EMAIL: owner@store.com
      E2E_OWNER_PASSWORD: Pass1234!
      E2E_CASHIER_EMAIL: cashier@store.com
      E2E_CASHIER_PASSWORD: Pass1234!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for SQLite
        run: npm run db:prepare:ci

      - name: Download Next.js build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Verify build artifact
        run: |
          set -euo pipefail
          test -d .next
          test -f .next/BUILD_ID || test -f .next/prerender-manifest.json || test -d .next/server

      - name: Focused POS/financial unit safety
        run: npm run test:pos-safety:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          set -euo pipefail
          npm run start -- -p 6200 > .ci-server.log 2>&1 &
          echo $! > .ci-server.pid
          for i in {1..60}; do
            if curl -fsS "$BASE_URL/login" >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat .ci-server.log || true
          exit 1

      - name: Offline sync smoke E2E
        run: npm run test:e2e:smoke

      # Route-speed remains a running-app latency regression check (not a substitute
      # for POS financial assertions). Kept in pos-safety because it requires BASE_URL.
      - name: Route speed check
        run: npm run test:perf

      - name: Deep owner-flow E2E
        run: npm run test:e2e:deep

      - name: Phase 3A financial QA
        run: npm run test:qa:phase3a

      # Read-only geometry last. Do not run it before smoke: owner POS visits
      # share the CI SQLite file with cashier till-open and can leave extras closed.
      - name: UI programme shell geometry
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:6200
        run: npm run test:e2e:ui-programme

      - name: Upload POS-safety artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-safety-artifacts
          path: |
            playwright/test-results/**
            docs/loading/GATE_E_LABORATORY_BENCHMARK.md
            docs/loading/GATE_F_POS_STABILITY.md
            tmp/ui-programme-evidence/**
            .ci-server.log
          if-no-files-found: ignore

  tishgroup:
    name: tishgroup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tishgroup-control
    env:
      TZ: Africa/Accra
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tishgroup_ci?schema=public
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/tishgroup_ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/tishgroup_ci?schema=public
      CONTROL_SESSION_SECRET: ci-control-session-secret
      CONTROL_ENFORCE_AUTH_CUTOVER: '0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tishgroup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            tishgroup-control/package-lock.json
            package-lock.json

      - name: Assert isolated CI database
        run: node scripts/assert-isolated-database.mjs

      - name: Install TishGroup dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, commercial, auth, and contract tests
        run: npm test

      - name: Secret scan
        working-directory: .
        run: |
          set -euo pipefail
          if rg -n "CONTROL_PLANE_ACCESS_KEY" tishgroup-control/app/login/page.tsx tishgroup-control/app/actions/control-auth.ts; then
            echo "Shared-key auth copy returned"
            exit 1
          fi
          if rg -n "id: 'adom-mart'" tishgroup-control/lib/control-data.ts tishgroup-control/lib/control-service.ts; then
            echo "Mock portfolio returned to runtime"
            exit 1
          fi
          if rg -n "ensure-control-schema" tishgroup-control/package.json; then
            echo "Build-time DDL returned"
            exit 1
          fi

      - name: Install root TillFlow dependencies
        working-directory: .
        run: npm ci

      - name: Validate control schema migrations
        working-directory: .
        run: node scripts/validate-control-migrations.mjs

      - name: Root TillFlow cross-application contract tests
        working-directory: .
        env:
          DATABASE_URL: file:./ci-tishgroup-contract.db
        run: |
          npx vitest run --reporter=dot lib/control-commercial-status.test.ts lib/control-money.test.ts lib/internal-control-billing-notes.test.ts lib/tishgroup-cross-app-contract.test.ts lib/control-schema-migration.test.ts lib/plan-pricing.test.ts

      - name: Production build with zero DDL
        env:
          CONTROL_ENFORCE_AUTH_CUTOVER: '0'
        run: npm run build

