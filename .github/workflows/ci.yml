name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  TZ: Africa/Accra

# Stable displayed check names (Gate 3 interface):
#   CI / lint
#   CI / unit
#   CI / typecheck
#   CI / build
#   CI / pos-safety
# Job `name:` values must stay literal — do not matrix or templatize them.
# Coverage is not a required gate — see docs/reliability/CI_GOVERNANCE.md.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci-unit.db
      TZ: Africa/Accra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for SQLite
        run: npm run db:prepare:ci

      # Repository gate: no unguarded `new PrismaClient(` in tests or new write-capable
      # scripts; guard/factory regression tests. Verbose so the sanitised DB identity is visible.
      - name: Database-target guard tests
        run: npm run guard:db

      - name: Unit tests
        run: npm test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Explicit tsc — independent of next build. Uses tsconfig.json (noEmit).
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci-build.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for SQLite
        run: npm run db:prepare:ci

      - name: Production build
        run: npm run build

      - name: Upload Next.js build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          if-no-files-found: error
          # `.next` is a dot-directory; upload-artifact@v4 excludes hidden paths by default.
          include-hidden-files: true

  pos-safety:
    name: pos-safety
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Job-local SQLite — does not share unit/build DB files.
      DATABASE_URL: file:./ci-pos-safety.db
      BASE_URL: http://localhost:6200
      E2E_OWNER_EMAIL: owner@store.com
      E2E_OWNER_PASSWORD: Pass1234!
      E2E_CASHIER_EMAIL: cashier@store.com
      E2E_CASHIER_PASSWORD: Pass1234!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for SQLite
        run: npm run db:prepare:ci

      - name: Download Next.js build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Verify build artifact
        run: |
          set -euo pipefail
          test -d .next
          test -f .next/BUILD_ID || test -f .next/prerender-manifest.json || test -d .next/server

      - name: Focused POS/financial unit safety
        run: npm run test:pos-safety:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline retry, reload and lost-response browser regression
        run: node scripts/commercial-offline-retry-browser.cjs

      - name: Start app
        env:
          # Review-only Reports routes (money layout) require preview/local gate under `next start`.
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          npm run start -- -p 6200 > .ci-server.log 2>&1 &
          echo $! > .ci-server.pid
          for i in {1..60}; do
            if curl -fsS "$BASE_URL/login" >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat .ci-server.log || true
          exit 1

      - name: Fresh service worker, owner sign-in and app navigation
        run: node scripts/app-loading-browser.cjs

      - name: Stock conversion workflow (320px, 390px and desktop)
        run: node scripts/stock-conversion-browser.cjs

      - name: Offline sync smoke E2E
        run: npm run test:e2e:smoke

      # Route-speed remains a running-app latency regression check (not a substitute
      # for POS financial assertions). Kept in pos-safety because it requires BASE_URL.
      - name: Route speed check
        run: npm run test:perf

      - name: Deep owner-flow E2E
        run: npm run test:e2e:deep

      - name: Phase 3A financial QA
        run: npm run test:qa:phase3a

      - name: Reports money layout (320px and 390px)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:6200
        run: npx playwright test --project=reports-money-layout-chromium

      # Read-only geometry last. Do not run it before smoke: owner POS visits
      # share the CI SQLite file with cashier till-open and can leave extras closed.
      - name: UI programme shell geometry
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:6200
        run: npm run test:e2e:ui-programme

      - name: Upload POS-safety artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-safety-artifacts
          path: |
            playwright/test-results/**
            docs/loading/GATE_E_LABORATORY_BENCHMARK.md
            docs/loading/GATE_F_POS_STABILITY.md
            tmp/ui-programme-evidence/**
            .ci-server.log
          if-no-files-found: ignore

  purchases-visual-evidence:
    name: purchases-visual-evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'remediation/purchases-simple-owner'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci-purchase-visual.db
      E2E_OWNER_EMAIL: owner@store.com
      E2E_OWNER_PASSWORD: Pass1234!
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:prepare:ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - uses: actions/checkout@v4
        with:
          ref: c75dadbfc8a58f255292560fdc99a1f65b05b5e6
          path: baseline
          persist-credentials: false
      - name: Build the exact pre-change app
        working-directory: baseline
        run: |
          npm ci
          npx prisma generate --schema=prisma/schema.prisma
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture actual before and after screens
        run: |
          set -euo pipefail
          npm run start -- -p 6200 > .candidate-server.log 2>&1 &
          (cd baseline && npm run start -- -p 6201) > .baseline-server.log 2>&1 &
          for port in 6200 6201; do
            for i in {1..60}; do
              if curl -fsS "http://localhost:$port/login" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://localhost:$port/login" >/dev/null
          done
          node scripts/purchases-visual-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchases-before-after
          path: |
            tmp/purchases-visual/*.png
            .candidate-server.log
            .baseline-server.log
          include-hidden-files: true

  offline-mobile-visual-evidence:
    name: offline-mobile-visual-evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'remediation/offline-mobile-checkout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and exercise actual POS components in an isolated browser
        env:
          FIXTURE_BASE_SHA: f9fd1ebd072c61dc3209d96b69ca4b8c63c0f80a
        run: |
          set -euo pipefail
          npx vite build --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/offline-mobile-before
          unset FIXTURE_BASE_SHA
          npx vite build --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/offline-mobile-after
          npx vite preview --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/offline-mobile-before --host 127.0.0.1 --port 4178 > /tmp/offline-before.log 2>&1 &
          npx vite preview --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/offline-mobile-after --host 127.0.0.1 --port 4177 > /tmp/offline-after.log 2>&1 &
          for port in 4177 4178; do
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:$port/tests/fixtures/offline-mobile/index.html" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/tests/fixtures/offline-mobile/index.html" >/dev/null
          done
          node scripts/offline-mobile-checkout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-mobile-before-after
          path: tmp/offline-mobile-evidence/*.png

  quick-cash-mobile-visual-evidence:
    name: quick-cash-mobile-visual-evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'remediation/quick-cash-mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and compare actual checkout components
        env:
          FIXTURE_BASE_SHA: 9e44e7707eae107c4b9b63ca5251d249c4013bd3
        run: |
          set -euo pipefail
          npx vite build --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/quick-cash-before
          unset FIXTURE_BASE_SHA
          npx vite build --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/quick-cash-after
          npx vite preview --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/quick-cash-before --host 127.0.0.1 --port 4178 > /tmp/quick-cash-before.log 2>&1 &
          npx vite preview --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/quick-cash-after --host 127.0.0.1 --port 4177 > /tmp/quick-cash-after.log 2>&1 &
          for port in 4177 4178; do
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:$port/tests/fixtures/offline-mobile/index.html" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/tests/fixtures/offline-mobile/index.html" >/dev/null
          done
          node scripts/quick-cash-mobile-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-cash-mobile-before-after
          path: tmp/quick-cash-mobile-evidence/*.png

  pos-shift-banner-mobile:
    name: pos-shift-banner-mobile
    if: github.event_name == 'pull_request' && github.head_ref == 'remediation/pos-shift-banner'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise actual POS at both phone widths
        run: |
          set -euo pipefail
          npx vite build --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/pos-shift-banner
          npx vite preview --config tests/fixtures/offline-mobile/vite.config.ts --outDir tmp/pos-shift-banner --host 127.0.0.1 --port 4177 > /tmp/pos-shift-banner.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4177/tests/fixtures/offline-mobile/index.html" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:4177/tests/fixtures/offline-mobile/index.html" >/dev/null
          node scripts/pos-shift-banner-mobile-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-shift-banner-mobile
          path: tmp/pos-shift-banner-mobile/*.png

  report-owner-visual-evidence:
    name: report-owner-visual-evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'remediation/simplify-income-statement-movement'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci-report-owner-visual.db
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare one disposable database (no migrations)
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --schema=prisma/schema.prisma --skip-generate
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - uses: actions/checkout@v4
        with:
          ref: a092b6aac2a8a04e9883de3dfec9381a11caa1a2
          path: baseline
          persist-credentials: false
      - name: Build exact pre-change app
        working-directory: baseline
        run: |
          npm ci
          npx prisma generate --schema=prisma/schema.prisma
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Seed synthetic report fixtures and compare both real apps
        run: |
          set -euo pipefail
          npm run start -- -p 6200 > /tmp/report-candidate.log 2>&1 &
          (cd baseline && npm run start -- -p 6201) > /tmp/report-baseline.log 2>&1 &
          for port in 6200 6201; do
            for i in {1..60}; do
              if curl -fsS "http://127.0.0.1:$port/login" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/login" >/dev/null
          done
          node scripts/report-owner-simplification-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-owner-before-after
          path: tmp/report-owner-simplification/

  product-cost-owner-mobile:
    name: product-cost-owner-mobile
    if: github.event_name == 'pull_request' && (github.head_ref == 'remediation/simplify-product-cost-resolution' || github.head_ref == 'remediation/one-screen-cost-fix' || github.head_ref == 'remediation/cost-wording-tidy')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci-report-owner-visual.db
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare disposable SQLite database (no migrations)
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --schema=prisma/schema.prisma --skip-generate
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Exercise real owner cost-review pages
        run: |
          set -euo pipefail
          npm run start -- -p 6200 > /tmp/product-cost-owner.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:6200/login" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:6200/login" >/dev/null
          node scripts/product-cost-owner-mobile-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-cost-owner-mobile
          path: tmp/product-cost-owner-mobile/

  expense-income-owner-mobile:
    name: expense-income-owner-mobile
    if: github.event_name == 'pull_request' && github.head_ref == 'remediation/expense-income-transparency'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci-report-owner-visual.db
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare disposable SQLite database (no migrations)
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma db push --schema=prisma/schema.prisma --skip-generate
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Exercise owner income and expense drilldowns
        run: |
          set -euo pipefail
          npm run start -- -p 6200 > /tmp/expense-income-owner.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:6200/login" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:6200/login" >/dev/null
          node scripts/expense-income-owner-mobile-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expense-income-owner-mobile
          path: tmp/expense-income-owner-mobile/
