name: Database Pilot Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/prisma.ts'
      - 'lib/services/purchases.ts'
      - 'lib/units/list-selectable-units.ts'
      - 'lib/reliability/in-flight-read.ts'
      - 'lib/reliability/database-pilot-load.pg.test.ts'
      - '.github/workflows/database-pilot-gate.yml'

permissions:
  contents: read

jobs:
  database-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tillflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tillflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: Africa/Accra
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public&connection_limit=5&pool_timeout=10&application_name=tillflow_pilot_database
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public&connection_limit=5&pool_timeout=10&application_name=tillflow_pilot_database
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public&connection_limit=5&pool_timeout=10&application_name=tillflow_pilot_database
      TILLFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public&connection_limit=5&pool_timeout=10&application_name=tillflow_pilot_database
      TILLFLOW_INCLUDE_PG_TESTS: '1'
      TILLFLOW_RUN_DATABASE_PILOT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.postgres.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma
      - name: Reproduce original composed-purchase pool starvation safely
        run: |
          set -euo pipefail
          cp lib/services/purchases.ts /tmp/pilot-purchases-fixed.ts
          trap 'cp /tmp/pilot-purchases-fixed.ts lib/services/purchases.ts' EXIT
          git show cebd811fe61363836cca65902fde083b557c0df1:lib/services/purchases.ts > lib/services/purchases.ts
          set +e
          npx vitest run lib/reliability/database-pilot-load.pg.test.ts -t 'all five pool slots' --reporter=verbose > database-pilot-before.log 2>&1
          baseline_exit=$?
          set -e
          cat database-pilot-before.log
          if [ "$baseline_exit" -eq 0 ]; then
            echo 'Expected baseline starvation did not reproduce; no confirmed mechanism claim is permitted.'
            exit 1
          fi
          if ! grep -q 'P2024' database-pilot-before.log; then
            echo 'Baseline failed for a reason other than Prisma connection-pool exhaustion.'
            exit 1
          fi
          cp /tmp/pilot-purchases-fixed.ts lib/services/purchases.ts
          trap - EXIT
      - name: Five-connection pilot workload and financial invariants
        run: |
          set -o pipefail
          npx vitest run lib/reliability/database-pilot-load.pg.test.ts --reporter=verbose 2>&1 | tee database-pilot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-pilot-evidence
          path: |
            database-pilot.log
            database-pilot-before.log
          retention-days: 14
