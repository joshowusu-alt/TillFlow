name: Database Pilot Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/prisma.ts'
      - 'lib/units/list-selectable-units.ts'
      - 'lib/reliability/in-flight-read.ts'
      - 'lib/reliability/database-pilot-load.pg.test.ts'
      - '.github/workflows/database-pilot-gate.yml'

permissions:
  contents: read

jobs:
  database-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tillflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tillflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: Africa/Accra
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
      TILLFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
      TILLFLOW_INCLUDE_PG_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.postgres.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma
      - name: Five-connection pilot workload and financial invariants
        run: |
          set -o pipefail
          npx vitest run lib/reliability/database-pilot-load.pg.test.ts --reporter=verbose 2>&1 | tee database-pilot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-pilot-evidence
          path: database-pilot.log
          retention-days: 14
