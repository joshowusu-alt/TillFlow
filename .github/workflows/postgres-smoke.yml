name: Postgres Smoke

# Path filter includes purchase concurrency coverage so paid createPurchase
# exact-once tests run on every reliability money-path change.
# POS-safety uses the same Preview-forbidden local SQLite app as CI.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/migration-p1-schema-pg-test.cjs'
      - 'scripts/migration-p1-slice2a-pg-test.cjs'
      - 'scripts/migration-p1-slice2b-pg-test.cjs'
      - 'scripts/migration-p1-sql-only-constraint-contract.cjs'
      - 'scripts/payment-receipt-origin-pg-test.cjs'
      - 'lib/payments/**'
      - 'lib/reports/money-received.ts'
      - 'lib/reports/money-received-classify.ts'
      - 'lib/reports/money-received.pg.test.ts'
      - 'lib/reports/money-received-scale.pg.test.ts'
      - 'lib/reports/money-received-unknown-method.pg.test.ts'
      - 'lib/reports/money-received-store-scope.pg.test.ts'
      - 'lib/reports/reporting-scope.ts'
      - 'docs/migration/P1_SLICE1_SQL_ONLY_CONSTRAINTS.md'
      - 'docs/migration/P1_SLICE2A_CONTRACT.md'
      - 'docs/migration/P1_SLICE2B_CONTRACT.md'
      - 'docs/payments/**'
      - 'lib/migration/**'
      - 'lib/services/migration/**'
      - 'lib/services/sales.ts'
      - 'lib/services/shifts.ts'
      - 'lib/services/cash-drawer.ts'
      - 'lib/services/returns.ts'
      - 'lib/services/payments.ts'
      - 'lib/services/expensePayments.ts'
      - 'lib/services/purchases.ts'
      - 'lib/services/purchases-concurrency.test.ts'
      - 'app/api/offline/**'
      - '.github/workflows/postgres-smoke.yml'

permissions:
  contents: read

jobs:
  migrate-status:
    runs-on: ubuntu-latest
    # Job timeout covers queue wait for a hosted runner plus execution.
    # Prior workflow_dispatch attempts cancelled at ~15m with runner_id=0 / steps=[]
    # (0 billable ms) — no test failure; the previous 15m budget expired while queued.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tillflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tillflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: Africa/Accra
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Postgres Prisma client
        run: npx prisma generate --schema=prisma/schema.postgres.prisma

      - name: Deploy complete migration history
        run: npx prisma migrate deploy --schema=prisma/schema.postgres.prisma

      - name: Check migration status
        run: npx prisma migrate status --schema=prisma/schema.postgres.prisma

      - name: Migration P1 PostgreSQL behavioural suite
        run: node scripts/migration-p1-schema-pg-test.cjs

      - name: Migration P1 Slice 2A PostgreSQL behavioural suite
        run: node scripts/migration-p1-slice2a-pg-test.cjs

      - name: Payment receipt-origin PostgreSQL behavioural suite
        run: npm run test:payment-receipt-origin:pg

      - name: Money received reporting PostgreSQL suite
        run: npx vitest run --reporter=dot lib/reports/money-received.pg.test.ts lib/reports/money-received-scale.pg.test.ts lib/reports/money-received-unknown-method.pg.test.ts lib/reports/money-received-store-scope.pg.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public

      - name: Migration P1 Slice 2B PostgreSQL behavioural suite
        run: node scripts/migration-p1-slice2b-pg-test.cjs

      - name: Migration P1 Slice 2B PostgreSQL service integration
        run: npx vitest run --reporter=dot lib/services/migration/slice2b-pg.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
          MIGRATION_SLICE2B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public

      - name: SQL-only constraint-contract introspection
        run: node scripts/migration-p1-sql-only-constraint-contract.cjs

      - name: Checkout, shift, and payment concurrency (Postgres)
        env:
          TZ: Africa/Accra
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
          SUPPLIER_PAYMENT_CONCURRENCY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tillflow_ci?schema=public
        run: |
          set -euo pipefail
          files=(
            lib/services/checkout-shift-cashdrawer-rtx.test.ts
            lib/services/payments-concurrency.test.ts
            lib/services/purchases-concurrency.test.ts
            lib/services/sales.test.ts
          )
          present=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              present+=("$f")
            else
              echo "skip missing $f"
            fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "No checkout/shift/concurrency tests present"
            exit 0
          fi
          npx vitest run --reporter=dot "${present[@]}"
